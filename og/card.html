<!doctype html>
<!-- Re-render both cards after any edit here. Both paths must be absolute, and
     --allow-file-access-from-files is load-bearing: without it the mask SVG below is blocked
     as cross-origin and the card renders face-less, with no error and no failed exit code.
     `msedge` may need spelling out: "C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe".
     msedge --headless --allow-file-access-from-files --screenshot=<repo>/public/og.png --window-size=1200,630 --force-device-scale-factor=1 --hide-scrollbars "file:///<repo>/og/card.html"
     msedge --headless --allow-file-access-from-files --screenshot=<repo>/public/og-ru.png --window-size=1200,630 --force-device-scale-factor=1 --hide-scrollbars "file:///<repo>/og/card.html?lang=ru" -->
<html>
<head>
<meta charset="utf-8">
<style>
  @font-face {
    font-family: 'JetBrains Mono Variable';
    src: url('../node_modules/@fontsource-variable/jetbrains-mono/files/jetbrains-mono-latin-wght-normal.woff2') format('woff2-variations');
    font-weight: 100 800;
  }
  /* Declared after the latin face and range-limited, so Cyrillic resolves here
     and every latin glyph still comes from the face the EN card already proved. */
  @font-face {
    font-family: 'JetBrains Mono Variable';
    src: url('../node_modules/@fontsource-variable/jetbrains-mono/files/jetbrains-mono-cyrillic-wght-normal.woff2') format('woff2-variations');
    font-weight: 100 800;
    unicode-range: U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116;
  }
  * { margin: 0; box-sizing: border-box; }
  body {
    width: 1200px; height: 630px; background: #0a0a0a; color: #f5f5f5;
    font-family: 'JetBrains Mono Variable', Consolas, monospace;
    display: grid; place-items: center;
  }
  .frame {
    position: relative; width: 1120px; height: 550px;
    border: 2px dashed rgba(180, 151, 207, 0.45);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 26px;
  }
  .corner { position: absolute; width: 18px; height: 18px; border: 2px solid #b497cf; }
  .tl { top: -2px; left: -2px; border-right: 0; border-bottom: 0; }
  .tr { top: -2px; right: -2px; border-left: 0; border-bottom: 0; }
  .bl { bottom: -2px; left: -2px; border-right: 0; border-top: 0; }
  .br { bottom: -2px; right: -2px; border-left: 0; border-top: 0; }
  .status {
    position: absolute; top: -14px; background: #0a0a0a; padding: 0 16px;
    font-size: 18px; letter-spacing: 0.2em; text-transform: uppercase; color: #b497cf;
  }
  .face {
    width: 108px; height: 192px; background: #b497cf;
    -webkit-mask: url('../public/face-icon-tight.svg') center / contain no-repeat;
    mask: url('../public/face-icon-tight.svg') center / contain no-repeat;
  }
  h1 { font-size: 56px; font-weight: 700; }
  .role { font-size: 28px; color: #d4c3e3; }
  .proof { font-size: 20px; color: #8a8a8a; }
</style>
</head>
<body>
  <div class="frame">
    <span class="corner tl"></span><span class="corner tr"></span>
    <span class="corner bl"></span><span class="corner br"></span>
    <span class="status" data-ru="РАЗБЛОКИРОВАНО: портфолио C++17/20 / Qt разработчика">UNLOCKED: C++17/20 / Qt Developer Portfolio</span>
    <div class="face"></div>
    <h1 data-ru="Владислав Климентьев">Vladislav Klimentev</h1>
    <div class="role" data-ru="C++17/20 разработчик — Tools / Gameplay">C++17/20 Developer — Tools / Gameplay</div>
    <div class="proof" data-ru="Qt-платформа в проде · собственный движок на C++ · me.cryzothic.tech">Qt platform in production · custom C++ engine · me.cryzothic.tech</div>
  </div>
  <script>
    // ?lang=ru renders the RU twin into public/og-ru.png. One card file rather than
    // two, so a layout tweak can never drift between the two languages.
    if (new URLSearchParams(location.search).get('lang') === 'ru')
      for (const el of document.querySelectorAll('[data-ru]')) el.textContent = el.dataset.ru;
  </script>
</body>
</html>
